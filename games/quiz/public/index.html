<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07070c">
<title>Кто быстрее — LAN-викторина</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23a78bfa'/%3E%3Cstop offset='1' stop-color='%2338e1ff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='24' height='24' rx='7' fill='url(%23g)'/%3E%3Cpath d='M13.4 4 6.5 13.2h4.3L10 20l6.9-9.2h-4.3L13.4 4Z' fill='%23100a22'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/css/app.css">
</head>
<body class="page-body home-simple-body">
<main class="page home-page home-simple">

  <header class="home-top">
    <a class="brand" href="/" aria-label="Кто быстрее — на главную">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M13.4 2 4.8 14.1h5.2L8.9 22l8.6-12.1h-5.2L13.4 2Z"/></svg>
      </span>
      <span class="brand-text">
        <span class="brand-name">Кто быстрее</span>
        <span class="brand-tag">LAN Quiz</span>
      </span>
    </a>

    <a class="icon-btn" href="/history" title="История игр" aria-label="История игр">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 12a9 9 0 1 0 2.6-6.4"/><path d="M3 4v5h5"/><path d="M12 8v4l3 2"/>
      </svg>
    </a>
  </header>

  <section class="home-hero">
    <h1>Кто <span class="grad-text">быстрее</span>?</h1>
    <p>Ведущий читает вопрос, игроки жмут «Я знаю!». Всё в одной комнате по Wi-Fi.</p>
  </section>

  <section class="card auth-card">
    <div class="mode-switch" role="tablist" aria-label="Как начать">
      <button class="mode-btn is-active" type="button" role="tab" aria-selected="true" aria-controls="create-form" data-mode="create">
        Создать игру
      </button>
      <button class="mode-btn" type="button" role="tab" aria-selected="false" aria-controls="join-form" data-mode="join">
        Войти по коду
      </button>
    </div>

    <form id="create-form" role="tabpanel" aria-label="Создать игру">
      <div class="field">
        <label for="room-name">Название комнаты</label>
        <input id="room-name" class="input" maxlength="30" value="Раунд 1" required>
      </div>
      <div class="field">
        <label for="create-nick">Ваш ник</label>
        <input id="create-nick" class="input" maxlength="20" placeholder="Ваш ник" autocomplete="nickname" required>
      </div>
      <button class="btn btn-primary" type="submit">Создать комнату</button>
      <p class="form-hint">Вы станете ведущим и получите код для игроков</p>
    </form>

    <form id="join-form" role="tabpanel" aria-label="Войти по коду" hidden>
      <div class="field">
        <label for="join-code">Код комнаты</label>
        <input id="join-code" class="input mono code-input" maxlength="4" placeholder="7K4Q" autocapitalize="characters" required>
      </div>
      <div class="field">
        <label for="join-nick">Ваш ник</label>
        <input id="join-nick" class="input" maxlength="20" placeholder="Ваш ник" autocomplete="nickname" required>
      </div>
      <button class="btn btn-primary" type="submit">Войти в комнату</button>
      <p class="form-hint">Код показывает ведущий на своём экране</p>
    </form>

    <p id="home-error" class="error" hidden></p>
  </section>

  <section id="room-list" class="card room-list-card" hidden>
    <div class="row-between">
      <h2>Открытые комнаты</h2>
      <span class="small">нажмите, чтобы войти</span>
    </div>
    <ul id="room-list-items" class="room-list"></ul>
  </section>
</main>

<script src="/socket.io/socket.io.js"></script>
<script type="module" src="/js/home.js"></script>
</body>
</html>
