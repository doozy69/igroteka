<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07070c">
<title>История игр — Кто быстрее</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23a78bfa'/%3E%3Cstop offset='1' stop-color='%2338e1ff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='24' height='24' rx='7' fill='url(%23g)'/%3E%3Cpath d='M13.4 4 6.5 13.2h4.3L10 20l6.9-9.2h-4.3L13.4 4Z' fill='%23100a22'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/css/app.css">
</head>
<body class="page-body">
<main class="page history-page">
  <header class="subpage-top">
    <a class="icon-btn" href="/" title="На главную" aria-label="На главную">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
    </a>
    <div class="page-heading">
      <span class="eyebrow">Архив</span>
      <h1>История игр</h1>
    </div>
    <div class="spacer"></div>
    <span id="count" class="badge" hidden></span>
  </header>

  <p id="status" class="small history-status">Загружаем историю…</p>
  <div id="list" class="stack history-list"></div>

  <div id="more-wrap" class="stack" style="margin-top:auto" hidden>
    <button id="more" class="btn btn-ghost" type="button">Показать ещё</button>
  </div>

  <p class="small center" style="margin:4px 0 0">
    Файл <span class="mono" style="color:var(--muted)">data/history.json</span> можно удалить — история очистится
  </p>
</main>

<script type="module" src="/js/history.js"></script>
</body>
</html>
