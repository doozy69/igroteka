<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0b0f1a"/>
      <stop offset="100%" style="stop-color:#141a2b"/>
    </linearGradient>
  </defs>
  
  <!-- Фон -->
  <rect width="1200" height="800" fill="url(#bgGrad)"/>
  
  <!-- Заголовок -->
  <text x="600" y="50" text-anchor="middle" font-size="32" font-weight="bold" fill="#22d3ee">Simple Quiz MVP</text>
  <text x="600" y="80" text-anchor="middle" font-size="18" fill="#93a1bd">Кто быстрей ответит?</text>
  
  <!-- Структура проекта -->
  <rect x="50" y="120" width="1100" height="680" rx="24" fill="#1e2a4a" stroke="#22d3ee" stroke-width="2"/>
  <text x="600" y="155" text-anchor="middle" font-size="24" font-weight="bold" fill="#e8eefc">Структура проекта</text>
  
  <!-- client -->
  <rect x="60" y="175" width="980" height="100" rx="12" fill="#141a2b"/>
  <text x="60" y="205" font-size="16" font-weight="bold" fill="#e8eefc">client/</text>
  <text x="80" y="230" font-size="14" fill="#93a1bd">src/ → App.tsx, components/, screens/, styles.css</text>
  
  <!-- server -->
  <rect x="60" y="285" width="980" height="100" rx="12" fill="#141a2b"/>
  <text x="60" y="315" font-size="16" font-weight="bold" fill="#e8eefc">server/</text>
  <text x="80" y="340" font-size="14" fill="#93a1bd">index.ts (Fastify + Socket.IO), db.ts (SQLite)</text>
  
  <!-- shared -->
  <rect x="60" y="395" width="980" height="100" rx="12" fill="#141a2b"/>
  <text x="60" y="425" font-size="16" font-weight="bold" fill="#e8eefc">shared/</text>
  <text x="80" y="450" font-size="14" fill="#93a1bd">protocol.ts (Zod-схемы)</text>
  
  <!-- Экраны -->
  <rect x="60" y="505" width="280" height="100" rx="12" fill="#141a2b" stroke="#a3e635" stroke-width="2"/>
  <text x="60" y="535" font-size="16" font-weight="bold" fill="#a3e635">Главная (/)</text>
  <text x="290" y="505" width="680" height="100" rx="12" fill="#141a2b"/>
  
  <rect x="350" y="505" width="280" height="100" rx="12" fill="#141a2b" stroke="#fbbf24" stroke-width="2"/>
  <text x="350" y="535" font-size="16" font-weight="bold" fill="#fbbf24">Лобби (/game/:id)</text>
  <text x="640" y="505" width="280" height="100" rx="12" fill="#141a2b"/>
  
  <!-- КРТИЧНЫЙ ЭКРАН -->
  <rect x="930" y="505" width="280" height="100" rx="12" fill="#141a2b" stroke="#22d3ee" stroke-width="4"/>
  <text x="930" y="535" font-size="16" font-weight="bold" fill="#22d3ee">Приём ответов (/r/:code)</text>
  <text x="960" y="560" font-size="14" fill="#22d3ee">★ ОГРОМНАЯ кнопка!</text>
  <text x="640" y="505" width="280" height="100" rx="12" fill="#141a2b"/>
  
  <!-- Итоги -->
  <rect x="60" y="615" width="980" height="100" rx="12" fill="#141a2b" stroke="#fb7185" stroke-width="2"/>
  <text x="60" y="645" font-size="16" font-weight="bold" fill="#fb7185">Итоги (/result)</text>
  
  <!-- Приоритеты -->
  <rect x="50" y="715" width="1100" height="85" rx="12" fill="#1e2a4a" stroke="#a3e635" stroke-width="2"/>
  <text x="60" y="735" font-size="16" font-weight="bold" fill="#a3e635">P0 — MVP</text>
  <text x="80" y="760" font-size="14" fill="#93a1bd">Сервер + SQLite + BuzzButton + очередь + вердикты</text>
</svg>
