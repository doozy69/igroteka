<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Simple Quiz — Приём ответов</title>
  <style>
    :root {
      --bg: #0b0f1a;
      --surface: #141a2b;
      --text: #e8eefc;
      --accent: #22d3ee;
      --success: #a3e635;
      --danger: #fb7185;
      --radius: 18px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, sans-serif;
    }

    .screen {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 24px;
      gap: 16px;
      /* На мобильном — CSS px для проверки */
    }

    /* Фаза приёмa ответов */
    .buzz-open {
      position: relative;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .question-header {
      background: linear-gradient(135deg, #1e2a4a, #0b0f1a);
      padding: 24px;
      border-radius: var(--radius);
      margin-bottom: 8px;
    }

    .question-text {
      font-size: 28px;
      line-height: 1.3;
      font-weight: 600;
      text-align: center;
      padding: 12px;
      background: rgba(255,255,255,0.05);
      border-radius: 12px;
    }

    .queue-container {
      flex: 1;
      min-height: 36vh;
      margin-bottom: auto;
      background: var(--surface);
      border-radius: var(--radius);
      padding: 16px;
      overflow-y: auto;
    }

    .queue-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(-20px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .queue-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 20px;
    }

    .queue-info { flex: 1; }
    .queue-nick { font-size: 16px; font-weight: 600; }
    .queue-offset { 
      font-size: 14px; 
      font-variant-numeric: tabular-nums; 
      opacity: 0.7;
    }

    .buzz-button-container {
      position: relative;
      height: 32vh; /* Критично! Не меньше трети экрана */
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .buzz-btn {
      width: 100%;
      min-height: 80px;
      background: var(--accent);
      color: #fff;
      border: none;
      font-size: clamp(24px, 6vw, 36px);
      font-weight: 700;
      border-radius: 24px;
      cursor: pointer;
      touch-action: manipulation;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      box-shadow: 0 8px 32px rgba(34, 211, 238, 0.4);
      transition: transform 0.1s, box-shadow 0.1s;
    }

    .buzz-btn:active {
      transform: scale(0.95);
      box-shadow: 0 4px 16px rgba(34, 211, 238, 0.3);
    }

    .buzz-status {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.7);
      padding: 8px 16px;
      border-radius: 24px;
      font-size: 14px;
    }

    /* Фаза ожидания */
    .buzz-waiting {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
    }

    .waiting-message {
      font-size: 24px;
      opacity: 0.7;
      text-align: center;
      margin-bottom: 24px;
    }

    /* Цвета игроков */
    .color-cyan { background: var(--accent); }
    .color-lime { background: var(--success); }
    .color-amber { background: #fbbf24; }
    .color-rose { background: var(--danger); }

    /* Активный игрок */
    .queue-item.active {
      border-left: 4px solid var(--accent);
      background: rgba(34, 211, 238, 0.1);
    }

    /* Правильный ответ */
    .queue-item.correct {
      border-left: 4px solid var(--success);
    }

    /* Неверный ответ */
    .queue-item.wrong {
      border-left: 4px solid var(--danger);
    }

    .status-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="screen">
    
    <!-- Фаза приёма ответов (buzz open) -->
    <div class="buzz-open">
      
      <!-- Заголовок с вопросом -->
      <div class="question-header">
        <h2 style="margin-bottom: 8px;">Вопрос раунда</h2>
        <div class="question-text" id="question">Нажмите, когда увидите вопрос!</div>
      </div>

      <!-- Очередь игроков -->
      <div class="queue-container" aria-live="polite">
        
        <!-- Игрок 1 (лидер) -->
        <div class="queue-item active color-cyan">
          <div class="queue-avatar color-cyan">А</div>
          <div class="queue-info">
            <div class="queue-nick">Alex</div>
            <div class="queue-offset">Лидер · +0.00 с</div>
          </div>
          <span class="status-badge">ждёт ответа</span>
        </div>

        <!-- Игрок 2 -->
        <div class="queue-item color-lime">
          <div class="queue-avatar color-lime">М</div>
          <div class="queue-info">
            <div class="queue-nick">Maria</div>
            <div class="queue-offset">+0.42 с</div>
          </div>
          <span class="status-badge">ждёт ответа</span>
        </div>

        <!-- Игрок 3 -->
        <div class="queue-item color-amber">
          <div class="queue-avatar color-amber">Д</div>
          <div class="queue-info">
            <div class="queue-nick">Dmitry</div>
            <div class="queue-offset">+0.84 с</div>
          </div>
          <span class="status-badge">ждёт ответа</span>
        </div>

      </div>

      <!-- Кнопка "Я знаю!" (критично!) -->
      <div class="buzz-button-container">
        <button class="buzz-btn" id="buzzBtn">
          Я ЗНАЮ!
        </button>
        
        <div class="buzz-status" id="buzzStatus">Нажмите, когда увидите вопрос</div>
      </div>

    </div>

  </div>
</body>
</html>
