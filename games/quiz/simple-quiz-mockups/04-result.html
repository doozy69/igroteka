<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Simple Quiz — Итоги раунда</title>
  <style>
    :root {
      --bg: #0b0f1a;
      --surface: #141a2b;
      --text: #e8eefc;
      --accent: #22d3ee;
      --success: #a3e635;
      --danger: #fb7185;
      --radius: 18px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, sans-serif;
    }

    .screen {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 24px;
      gap: 16px;
    }

    h1 { font-size: 32px; font-weight: 700; letter-spacing: -0.02em; }
    
    .winner-card {
      background: linear-gradient(135deg, var(--success), transparent);
      padding: 24px;
      border-radius: var(--radius);
      text-align: center;
      margin-bottom: 8px;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.9; }
    }

    .winner-title {
      font-size: 48px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .winner-name {
      font-size: 28px;
      font-weight: 600;
      color: var(--success);
    }

    .result-table {
      flex: 1;
      background: var(--surface);
      border-radius: var(--radius);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
    }

    .result-row {
      display: flex;
      align-items: center;
      padding: 12px;
      border-radius: 12px;
      gap: 12px;
    }

    .rank-badge {
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 20px;
      border-radius: 8px;
    }

    .rank-1 { background: var(--success); }
    .rank-2 { background: #fbbf24; }
    .rank-3 { background: rgba(255,255,255,0.2); }

    .player-info { flex: 1; }
    .player-nick { font-size: 18px; font-weight: 600; }
    .player-status { font-size: 14px; opacity: 0.7; margin-top: 4px; }

    .score-badge {
      padding: 8px 16px;
      background: rgba(255,255,255,0.1);
      border-radius: 12px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .action-buttons {
      display: flex;
      gap: 12px;
      margin-top: 8px;
    }

    .btn {
      padding: 14px 24px;
      border-radius: var(--radius);
      border: none;
      font-weight: 600;
      cursor: pointer;
      flex: 1;
    }

    .btn-primary { background: var(--accent); color: #fff; }
    .btn-secondary { background: transparent; color: var(--text); opacity: 0.7; }
    
    /* Состояния */
    .status-correct { color: var(--success); }
    .status-wrong { color: var(--danger); }
    
    .verdict-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      margin-left: 8px;
    }
    
    .badge-correct { background: rgba(163, 230, 53, 0.2); color: var(--success); }
    .badge-wrong { background: rgba(251, 113, 133, 0.2); color: var(--danger); }
  </style>
</head>
<body>
  <div class="screen">
    
    <h1>🎯 Итоги раунда</h1>

    <!-- Карточка победителя -->
    <div class="winner-card">
      <div class="winner-title">🥇 Победитель</div>
      <div class="winner-name">Alex (+0.45с)</div>
    </div>

    <!-- Таблица результатов -->
    <div class="result-table" aria-live="polite">
      
      <!-- 1 место -->
      <div class="result-row rank-1">
        <div class="rank-badge">1</div>
        <div class="player-info">
          <div class="player-nick">Alex</div>
          <div class="player-status status-correct" data-verdict="correct">
            Верно ✓<span class="verdict-badge badge-correct"></span>
          </div>
        </div>
        <div class="score-badge">+10 очков</div>
      </div>

      <!-- 2 место -->
      <div class="result-row rank-2">
        <div class="rank-badge">2</div>
        <div class="player-info">
          <div class="player-nick">Maria</div>
          <div class="player-status status-wrong" data-verdict="wrong">
            Неверно ✗<span class="verdict-badge badge-wrong"></span>
          </div>
        </div>
        <div class="score-badge">0 очков</div>
      </div>

      <!-- 3 место -->
      <div class="result-row rank-3">
        <div class="rank-badge">3</div>
        <div class="player-info">
          <div class="player-nick">Dmitry</div>
          <div class="player-status status-wrong" data-verdict="wrong">
            Неверно ✗<span class="verdict-badge badge-wrong"></span>
          </div>
        </div>
        <div class="score-badge">0 очков</div>
      </div>

    </div>

    <!-- Кнопки действий -->
    <div class="action-buttons">
      <button class="btn btn-primary">Следующий раунд</button>
      <button class="btn btn-secondary">В меню</button>
    </div>

  </div>
</body>
</html>
