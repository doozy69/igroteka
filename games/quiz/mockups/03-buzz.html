<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>03 · Приём ответов</title>
<link rel="stylesheet" href="styles.css">
</head>
<body class="phone">
<div class="screen">
  <div class="top">
    <div class="small">7K4Q · раунд 1</div>
    <div class="spacer"></div>
    <div class="chip"><span class="muted">очки</span> <b class="mono">0</b></div>
    <div class="icon-btn">✕</div>
  </div>

  <div class="card" style="gap:8px">
    <div class="row-between">
      <h2>Игроки</h2>
      <span class="small">4</span>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
      <div class="mini"><span class="avatar" style="background:#22d3ee">1</span><span class="nick">Игрок 1</span><b class="mono">1</b></div>
      <div class="mini"><span class="avatar" style="background:#a3e635">2</span><span class="nick">Игрок 2</span><b class="mono">0</b></div>
      <div class="mini"><span class="avatar" style="background:#fbbf24">3</span><span class="nick">Игрок 3</span><b class="mono">2</b></div>
      <div class="mini"><span class="avatar" style="background:#fb7185">4</span><span class="nick">Игрок 4</span><b class="mono">0</b></div>
    </div>
  </div>

  <div class="card">
    <div class="row-between">
      <h2>Очередь</h2>
      <span class="small mono">0.00 → +0.91</span>
    </div>
    <div class="queue">
      <div class="qitem leader">
        <span class="rank">1</span>
        <span class="avatar" style="background:#22d3ee">1</span>
        <span class="nick">Игрок 1</span>
        <span class="time">0.00 с</span>
      </div>
      <div class="qitem">
        <span class="rank">2</span>
        <span class="avatar" style="background:#a3e635">2</span>
        <span class="nick">Игрок 2</span>
        <span class="time">+0.42 с</span>
      </div>
      <div class="qitem">
        <span class="rank">3</span>
        <span class="avatar" style="background:#fbbf24">3</span>
        <span class="nick">Игрок 3</span>
        <span class="time">+0.91 с</span>
      </div>
    </div>
  </div>

  <div class="small" style="text-align:center">Нажмите один раз — время считается с открытия приёма</div>

  <button class="big-buzz">Я ЗНАЮ!<span>нажми первым</span></button>
</div>
</body>
</html>
