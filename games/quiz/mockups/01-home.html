<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>01 · Главная</title>
<link rel="stylesheet" href="styles.css">
</head>
<body class="phone">
<div class="screen">
  <div class="top">
    <div class="badge">LAN · без интернета</div>
    <div class="spacer"></div>
    <div class="small">мини-игра</div>
  </div>

  <div>
    <h1>Кто быстрее</h1>
    <p class="muted" style="margin:8px 0 0;font-size:14px;line-height:1.45">
      Одна комната. Ведущий читает вопрос, все жмут кнопку.
      Порядок и время считает сервер.
    </p>
  </div>

  <div class="card">
    <div class="row-between">
      <h2>Создать комнату</h2>
      <span class="badge">ведущий</span>
    </div>
    <div>
      <label>Название комнаты</label>
      <input class="input" value="Раунд 1">
    </div>
    <div>
      <label>Ваш ник</label>
      <input class="input" value="Игрок 1">
    </div>
    <button class="btn btn-primary">Создать и играть</button>
  </div>

  <div class="divider">или</div>

  <div class="card">
    <h2>Войти по коду</h2>
    <div>
      <label>Код комнаты</label>
      <input class="input mono" value="7K4Q" style="letter-spacing:.18em;font-size:20px;font-weight:700">
    </div>
    <div>
      <label>Ваш ник</label>
      <input class="input" value="Ведущий">
    </div>
    <button class="btn btn-ghost">Войти</button>
  </div>

  <div style="margin-top:auto;display:flex;justify-content:center">
    <span class="small">История игр →</span>
  </div>
</div>
</body>
</html>
