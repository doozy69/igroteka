<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>05 · Итоги</title>
<link rel="stylesheet" href="styles.css">
</head>
<body class="phone">
<div class="screen">
  <div class="top">
    <div class="badge lime">игра завершена</div>
    <div class="spacer"></div>
    <div class="small mono">7K4Q</div>
  </div>

  <div style="text-align:center;margin-top:4px">
    <div style="font-size:44px;line-height:1">🏆</div>
    <h1 style="font-size:26px;margin-top:8px">Игрок 1 побеждает</h1>
    <div class="small">3 очка · 3 раунда · 4 игрока</div>
  </div>

  <div class="card" style="gap:0;padding-top:6px;padding-bottom:6px">
    <div class="player">
      <span class="rank">1</span>
      <span class="avatar" style="background:#22d3ee">1</span>
      <span class="nick">Игрок 1</span>
      <span class="score" style="color:var(--amber)">3</span>
    </div>
    <div class="player">
      <span class="rank">2</span>
      <span class="avatar" style="background:#a3e635">2</span>
      <span class="nick">Игрок 2</span>
      <span class="score">2</span>
    </div>
    <div class="player">
      <span class="rank">3</span>
      <span class="avatar" style="background:#fbbf24">3</span>
      <span class="nick">Игрок 3</span>
      <span class="score">1</span>
    </div>
    <div class="player">
      <span class="rank">4</span>
      <span class="avatar" style="background:#fb7185">4</span>
      <span class="nick">Игрок 4</span>
      <span class="score">0</span>
    </div>
  </div>

  <div class="card" style="gap:8px">
    <div class="row-between">
      <span class="small">Сохранено в</span>
      <span class="mono small" style="color:var(--text)">data/history.json</span>
    </div>
    <div class="row-between">
      <span class="small">Длительность</span>
      <span class="mono small" style="color:var(--text)">12:34</span>
    </div>
  </div>

  <div class="card" style="gap:0;padding-top:6px;padding-bottom:6px">
    <div class="row-between" style="padding:7px 0">
      <span class="small">Раунд 1</span>
      <span class="small" style="color:var(--lime)">Игрок 1 ✓</span>
    </div>
    <div class="row-between" style="padding:7px 0;border-top:1px solid var(--border)">
      <span class="small">Раунд 2</span>
      <span class="small" style="color:var(--lime)">Игрок 3 ✓</span>
    </div>
    <div class="row-between" style="padding:7px 0;border-top:1px solid var(--border)">
      <span class="small">Раунд 3</span>
      <span class="small" style="color:var(--lime)">Игрок 1 ✓</span>
    </div>
  </div>

  <div style="margin-top:auto;display:flex;flex-direction:column;gap:10px">
    <button class="btn btn-primary">История игр</button>
    <button class="btn btn-ghost">На главную</button>
  </div>
</div>
</body>
</html>
