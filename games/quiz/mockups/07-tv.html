<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>07 · ТВ-табло</title>
<link rel="stylesheet" href="styles.css">
</head>
<body class="tvpage">
<div class="screen tv">
  <div class="tv-top">
    <div style="display:flex;align-items:center;gap:10px">
      <div style="font-size:28px">⚡</div>
      <div>
        <div style="font-size:22px;font-weight:750">Кто быстрее</div>
        <div class="small" style="font-size:14px">Раунд 3 из 5 · 4 игрока</div>
      </div>
    </div>
    <div class="spacer"></div>
    <div class="chip mono" style="height:46px;font-size:20px;padding:0 18px">7K4Q</div>
    <div class="chip" style="height:46px;font-size:17px;padding:0 18px">demo.local:8103/r/7K4Q</div>
  </div>

  <div class="tv-grid">
    <div class="tv-left">
      <div class="card" style="background:transparent;border:none;padding:0;gap:16px">
        <div class="small" style="font-size:18px">Вопрос</div>
        <div style="font-size:60px;font-weight:800;line-height:1.12;letter-spacing:-.02em">
          Какой город является столицей Австралии?
        </div>
      </div>

      <div class="tv-timer">
        <span class="mono" style="font-size:56px;font-weight:800;color:var(--cyan)">00:07</span>
        <span class="small" style="font-size:18px">приём ответов открыт</span>
      </div>
    </div>

    <div class="tv-right">
      <div class="card">
        <div class="row-between">
          <h2 style="font-size:24px">Гонка</h2>
          <span class="small" style="font-size:16px">3 нажатия</span>
        </div>
        <div class="queue">
          <div class="qitem leader">
            <span class="rank">1</span>
            <span class="avatar" style="background:#22d3ee">1</span>
            <span class="nick">Игрок 1</span>
            <span class="time">0.00 с</span>
          </div>
          <div class="qitem">
            <span class="rank">2</span>
            <span class="avatar" style="background:#a3e635">2</span>
            <span class="nick">Игрок 2</span>
            <span class="time">+0.42 с</span>
          </div>
          <div class="qitem">
            <span class="rank">3</span>
            <span class="avatar" style="background:#fbbf24">3</span>
            <span class="nick">Игрок 3</span>
            <span class="time">+0.91 с</span>
          </div>
        </div>
      </div>

      <div class="card" style="gap:0;flex:1">
        <div class="row-between" style="padding-bottom:8px">
          <h2 style="font-size:24px">Счёт</h2>
          <span class="small" style="font-size:16px">после 2 раундов</span>
        </div>
        <div class="player">
          <span class="rank">1</span>
          <span class="avatar" style="background:#fbbf24">3</span>
          <span class="nick">Игрок 3</span>
          <span class="score">2</span>
        </div>
        <div class="player">
          <span class="rank">2</span>
          <span class="avatar" style="background:#22d3ee">1</span>
          <span class="nick">Игрок 1</span>
          <span class="score">1</span>
        </div>
        <div class="player">
          <span class="rank">3</span>
          <span class="avatar" style="background:#a3e635">2</span>
          <span class="nick">Игрок 2</span>
          <span class="score">0</span>
        </div>
        <div class="player">
          <span class="rank">4</span>
          <span class="avatar" style="background:#fb7185">4</span>
          <span class="nick">Игрок 4</span>
          <span class="score">0</span>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
