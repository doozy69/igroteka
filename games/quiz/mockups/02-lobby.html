<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>02 · Лобби</title>
<link rel="stylesheet" href="styles.css">
</head>
<body class="phone">
<div class="screen">
  <div class="top">
    <div class="icon-btn">←</div>
    <div>
      <div class="small">Комната</div>
      <div style="font-weight:650">Раунд 1</div>
    </div>
    <div class="spacer"></div>
    <div class="badge amber">вы ведущий</div>
  </div>

  <div class="card" style="text-align:center;gap:4px">
    <div class="small">Код комнаты</div>
    <div class="mono" style="font-size:44px;font-weight:800;letter-spacing:.12em;color:var(--cyan)">7K4Q</div>
    <div class="small">Телефоны: <span class="mono" style="color:var(--text)">demo.local:8103/r/7K4Q</span></div>
  </div>

  <div class="card" style="gap:0;padding-bottom:8px">
    <div class="row-between" style="padding-bottom:8px">
      <h2>Игроки</h2>
      <span class="small mono">4 / 12</span>
    </div>
    <div class="player">
      <span class="avatar" style="background:#22d3ee">1</span>
      <span class="nick">Игрок 1<span class="you">вы</span></span>
      <span class="score">0</span>
    </div>
    <div class="player">
      <span class="avatar" style="background:#a3e635">2</span>
      <span class="nick">Игрок 2</span>
      <span class="score">0</span>
    </div>
    <div class="player">
      <span class="avatar" style="background:#fbbf24">3</span>
      <span class="nick">Игрок 3</span>
      <span class="score">0</span>
    </div>
    <div class="player">
      <span class="avatar" style="background:#fb7185">4</span>
      <span class="nick">Игрок 4</span>
      <span class="score">0</span>
    </div>
  </div>

  <div class="card" style="gap:6px">
    <div class="small" style="color:var(--text);font-weight:650">Как подключиться</div>
    <div class="small">1. Телефон в той же Wi-Fi сети</div>
    <div class="small">2. Откройте адрес выше в браузере</div>
    <div class="small">3. Введите код и ник</div>
  </div>

  <div style="margin-top:auto;display:flex;flex-direction:column;gap:10px">
    <div class="small" style="text-align:center">Вы тоже играете — кнопка «Я знаю!» будет у вас</div>
    <button class="btn btn-primary" style="height:58px;font-size:17px">Начать игру</button>
  </div>
</div>
</body>
</html>
