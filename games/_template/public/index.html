<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Новая игра</title>
  <link rel="stylesheet" href="style.css">
  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main class="card">
    <p class="kicker">шаблон игры</p>
    <h1>Новая игра</h1>
    <p class="lead">Замените этот экран своей игрой. Шаблон уже умеет отдавать статику, сообщать health и держать Socket.IO.</p>

    <div class="status">
      <span class="dot" id="dot"></span>
      <span id="status">подключение…</span>
    </div>

    <button id="ping" type="button">Проверить связь</button>
    <p class="hint" id="result"></p>
  </main>
</body>
</html>
