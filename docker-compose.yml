services:
  igroteka:
    build: .
    image: igroteka:1.0.0
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "8101:8101"
      - "8102:8102"
      - "8103:8103"
    environment:
      NO_OPEN: "1"
      # Укажите LAN-IP компьютера, чтобы QR и ссылки вели на хост, а не в контейнер.
      PUBLIC_HOST: "${PUBLIC_HOST:-}"
    volumes:
      - ./games/100k/data:/app/games/100k/data
      - ./games/svoy/data:/app/games/svoy/data
      - ./games/quiz/data:/app/games/quiz/data
