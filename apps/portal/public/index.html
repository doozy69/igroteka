<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08090d">
  <title>Игротека</title>
  <meta name="description" content="Локальная игротека: выберите игру, откройте её на большом экране, а гости подключатся по QR-коду.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23f0b429'/%3E%3Ctext x='32' y='45' font-family='Georgia,serif' font-size='38' font-weight='700' text-anchor='middle' fill='%2308090d'%3E%D0%98%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="/" aria-label="Игротека — на главную">
        <span class="brand-mark">И</span>
        <span class="brand-name">Игротека</span>
      </a>

      <div class="net" aria-label="Адрес для гостей">
        <span class="net-dot" aria-hidden="true"></span>
        <code id="lanUrl">загрузка…</code>
        <button class="icon" id="copyLan" type="button" aria-label="Скопировать адрес" title="Скопировать адрес">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>
        </button>
        <button class="icon accent" id="showQr" type="button" aria-label="Показать QR-код" title="Показать QR-код">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="6" height="6"/><rect x="15" y="3" width="6" height="6"/><rect x="3" y="15" width="6" height="6"/><path d="M15 15h2v2h-2zM19 15h2M19 19h2v2M15 21v-2"/></svg>
        </button>
      </div>
    </header>

    <main>
      <section class="hero">
        <div>
          <p class="kicker">локальная сеть</p>
          <h1>Во что<br><em>играем?</em></h1>
        </div>
        <div class="hero-side" aria-hidden="true">
          <span class="hero-number" id="gameCount">03</span>
          <span class="hero-label">игры</span>
        </div>
      </section>

      <section class="games" id="games" aria-live="polite" aria-busy="true">
        <div class="loading">Собираем игротеку…</div>
      </section>
    </main>

    <footer>
      <span>Игротека</span>
      <span><span id="year"></span></span>
    </footer>
  </div>

  <dialog id="qrDialog" aria-labelledby="qrTitle">
    <div class="qr-panel">
      <button class="qr-close" id="closeQr" type="button" aria-label="Закрыть">×</button>
      <p class="kicker">подключение</p>
      <h2 id="qrTitle">Наведите камеру</h2>
      <div class="qr-frame">
        <img id="qrImg" alt="QR-код для подключения к игротеке">
      </div>
      <code class="qr-url" id="qrUrl"></code>
      <p class="qr-hint">Телефон должен быть в той же Wi-Fi сети.</p>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
